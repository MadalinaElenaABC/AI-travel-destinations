<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="src/style.css" />
    <title>Your Dream Trip</title>
  </head>

  <body>
    <header>
      <h1>AI Dream Trip Generator</h1>
    </header>

    <main>
      <form>
        <input
          type="text"
          id="destination"
          placeholder="Describe your dream trip..."
          autofocus
          required
          autocomplete="off"
        />

        <button type="submit">Submit</button>
      </form>

      <div id="result" class="hidden"></div>
    </main>

    <footer>
      This project was coded by
      <a href="https://github.com/MadalinaElenaABC" target="_blank">Madalina</a
      >, is open-sourced on
      <a
        href="https://github.com/MadalinaElenaABC/AI-travel-destinations"
        target="_blank"
        >GitHub</a
      >
      and hosted on
      <a href="https://aitraveldestinations.netlify.app/" target="_blank"
        >Netlify</a
      >
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>

    <script src="src/index.js"></script>
  </body>
</html>
